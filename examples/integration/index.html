import {mountDocumentEditor} from '../../src/planning.mjs';import {createDocumentClient} from './adapter.mjs';const client=createDocumentClient('/api/document');try{const document=await client.read();window.editor=mountDocumentEditor(window.document.querySelector('#editor'),document,{locale:'en',onSave:async(value,signal)=>{try{return await client.save(value,signal);}catch(error){window.document.querySelector('#status').textContent=error.code==='CONFLICT'?'Another tab saved a newer version. Your draft remains; review the current server version before retrying.':'Save not confirmed. Your draft remains.';throw error;}}});}catch{document.querySelector('#status').textContent='Read failed. Start the reference server with an explicit data file.';}
