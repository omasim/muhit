<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Muhit · Bölümlü arama indeksi</title><link rel="stylesheet" href="../styles/index.css"><body class="mh-scope"><main style="max-width:48rem;margin:auto;padding:24px"><h1>Arama indeksi</h1><p>10.000 kurgu kayıt. Kurulum kısa dilimlerde çalışır; iptal kısmi indeks üretmez. Veriler yalnız bu oturumdadır.</p><button id="build">İndeksi hazırla</button> <button id="cancel" disabled>İptal</button><label>Kurulum sırasında da yazabilirsiniz <input id="query" type="search"></label><button id="search" disabled>Ara</button><p id="status" role="status"></p><ul id="results"></ul></main><script type="module">
import {createSearchIndexAsync} from '../src/search-index.mjs';
const $=id=>document.getElementById(id);let controller,index,revision=0;
$('build').onclick=async()=>{const current=++revision;controller?.abort();controller=new AbortController();$('build').disabled=true;$('cancel').disabled=false;$('status').textContent='İndeks hazırlanıyor…';try{const next=await createSearchIndexAsync(Array.from({length:10000},(_,i)=>({id:String(i),title:'Araştırma '+i})),{signal:controller.signal});if(current!==revision)return;index=next;$('search').disabled=false;$('status').textContent='İndeks hazır.';}catch(e){if(current===revision)$('status').textContent=e.name==='AbortError'?'İptal edildi; varsa önceki indeks korunuyor.':'Kurulum başarısız; varsa önceki indeks korunuyor.';}finally{if(current===revision){$('build').disabled=false;$('cancel').disabled=true;}}};
$('cancel').onclick=()=>controller?.abort();$('search').onclick=()=>{const result=index.search($('query').value);$('results').replaceChildren(...result.items.map(item=>{const li=document.createElement('li');li.textContent=item.title;return li}));$('status').textContent=result.total+' sonuç; ilk '+result.items.length+' gösteriliyor.'};
</script></body></html>
