<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Muhit · State catalog</title><link rel="stylesheet" href="../styles/index.css"><style>body{margin:0;background:var(--mh-bg);color:var(--mh-text)}main{max-width:1100px;margin:auto;padding:24px;display:grid;gap:24px;min-width:0}.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:24px}.two>*{min-width:0}</style></head><body class="mh-scope"><main class="mh-stack"><h1>Human knowledge, shared purpose</h1><p>Deterministic visual fixture · sample data</p><article class="mh-card"><h2>Ideas in context</h2><p>A long description tests wrapping and comfortable reading across themes, density, larger type and narrow screens.</p><button type="button" class="mh-button mh-button--primary">Explore</button></article><div id="grid"></div><div class="two"><div id="form"></div><div id="plot"></div></div></main><script type="module">
