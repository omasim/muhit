<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Muhit · State catalog</title><link rel="stylesheet" href="../styles/index.css"><style>body{margin:0;background:var(--mh-bg);color:var(--mh-text)}main{max-width:1100px;margin:auto;padding:24px;display:grid;gap:24px;min-width:0}.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:24px}.two>*{min-width:0}</style></head><body class="mh-scope"><main class="mh-stack"><h1>Human knowledge, shared purpose</h1><p>Deterministic visual fixture · sample data</p><article class="mh-card"><h2>Ideas in context</h2><p>A long description tests wrapping and comfortable reading across themes, density, larger type and narrow screens.</p><button type="button" class="mh-button mh-button--primary">Explore</button></article><div id="grid"></div><div class="two"><div id="form"></div><div id="plot"></div></div></main><script type="module">
import {MuhitDataGrid as G,MuhitForm as F,MuhitPlot as P,MuhitTheme as T,MuhitFields as Fields,MuhitWidgets as W,MuhitI18n as I} from '../src/index.mjs';
import de from '../locales/de.mjs'; import ar from '../locales/ar.mjs'; I.register('de',de); I.register('ar',ar);
const name=new URLSearchParams(location.search).get('case')||'light';const config={motion:'reduced',...(name==='dark'?{mode:'dark'}:{}),...(name==='compact'?{density:'compact',controlSize:'sm',tableRows:'striped'}:{}),...(name==='large-rtl'?{scale:1.25,headingScale:1.15}:{}),...(name==='custom'?{accent:'#744749',cardSurface:'tinted',border:'strong'}:{})};T.apply(config);
if(name==='large-rtl'||name==='arabic')document.documentElement.dir='rtl';
const locale=name==='german'?'de':name==='arabic'?'ar':'en';document.documentElement.lang=locale;
if(name==='zoom')T.apply({scale:1.25,headingScale:1.15});
const rows=[{id:'one',name:'Research and long-term shared knowledge systems',score:1234.5},{id:'two',name:'Human-centered design',score:42}];const options={locale,dir:document.documentElement.dir||'ltr',title:'Projects',selectable:true,columns:[{key:'name',label:'Project'},{key:'score',label:'Score',type:'number'}]};
if(name==='loading')options.load=()=>new Promise(()=>{});else if(name==='error')options.load=async()=>{throw new Error('Simulated')};else options.rows=name==='empty'?[]:rows;
G.mount('#grid',options);F.mount('#form',{locale,dir:options.dir,title:'Contact',fields:[{name:'name',label:'Name',required:true},{name:'notes',label:'Notes',type:'textarea'}],values:{name:'Ada',notes:'A considered interface for shared work.'}});P.mount('#plot',{locale,title:'Progress',unit:'points',kind:'bar',labels:['Research','Design'],series:[{id:'score',label:'Score',values:[12,24]}]});
if(['groups','combo','kanban','german','arabic','zoom'].includes(name)){
 const h=document.createElement('div');document.querySelector('main').append(h);
 if(name==='groups'){
  const f=Fields.repeater(h,{locale,fields:[{name:'email',label:'Email',type:'email',required:true}],values:[{email:''},{email:'invalid'}]});f.validate();
 }else if(name==='combo'){
  Fields.combobox(h,{locale,label:'Project owner',delay:0,load:async()=>[{id:'ada',label:'Ada — Research and shared knowledge systems'},{id:'deniz',label:'Deniz'}]});
  h.querySelector('input').dispatchEvent(new KeyboardEvent('keydown',{key:'ArrowDown',bubbles:true}));
  await new Promise(r=>setTimeout(r,30));
 }else if(name==='kanban'){
  W.mount(h,{type:'kanban',id:'board',title:'Shared work',columns:[{id:'todo',title:'Planned'},{id:'done',title:'Done'}],items:[{id:'one',title:'A carefully considered long project title',column:'todo'}]},{locale});
 }
}
await document.fonts.ready;window.catalogReady=true;
</script></body></html>
