<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Muhit · Scale and movement</title><link rel="stylesheet" href="../styles/index.css"><style>body{margin:0;background:var(--mh-bg)}main{max-width:1200px;margin:auto;padding:24px;display:grid;gap:24px}main>*{min-width:0}</style><link rel="stylesheet" href="../styles/pages.css"></head><body class="mh-scope"><a class="mh-skip" href="#main">Skip to content</a><main class="mh-content" id="main" tabindex="-1" data-page-recipe="workspace" data-width="wide"><h1>Scale and movement</h1><p>Sample data. Paginated rows keep the document small; the application can supply remote results. Drag a card by its Move button, or use Space, arrows and Enter. The status selector remains available.</p><h2>Work board</h2><div id="board"></div><div id="grid"></div></main><script type="module">
import{MuhitWidgets as W,MuhitDataGrid as G,MuhitTheme as T}from'../src/index.mjs';T.apply({});
window.board=W.mount('#board',{id:'work',type:'kanban',title:'Shared work',columns:[{id:'ideas',title:'Ideas'},{id:'doing',title:'In progress'},{id:'done',title:'Complete'}],items:[{id:'one',title:'Research',column:'ideas'},{id:'two',title:'Prototype',column:'doing'}]},{locale:'en',onAction:e=>window.lastMove=e});
window.grid=G.mount('#grid',{locale:'en',title:'Research records',columns:[{key:'title',label:'Title'},{key:'score',label:'Score',type:'number'}],rows:Array.from({length:10000},(_,i)=>({id:'r'+i,title:'Research record '+i,score:i%101}))});
</script></body></html>
