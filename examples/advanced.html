<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Muhit · Advanced fields</title><link rel="stylesheet" href="../styles/index.css"><style>body{margin:0;background:var(--mh-bg);color:var(--mh-text)}main{max-width:1100px;margin:auto;padding:24px;display:grid;gap:24px} .columns{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:24px}.columns>*{min-width:0}</style></head><body class="mh-scope"><main><img src="../assets/brand/muhit-logo.svg" width="140" alt="Muhit"><h1>Advanced form workflows</h1><p>Sample data. Search and validation use a simulated provider. No data is sent to a server.</p><a class="mh-text-link" href="international.html">Language and column layout</a><div class="columns"><div id="profile"></div><section class="mh-panel mh-stack"><h2>Team lookup</h2><div id="lookup"></div><p id="selected" role="status"></p></section></div><div id="members"></div><p id="saved" role="status"></p></main><script type="module">
import {MuhitTheme,MuhitForm,MuhitFields} from '../src/index.mjs';MuhitTheme.apply({});
const wait=signal=>new Promise((resolve,reject)=>{const timer=setTimeout(resolve,150);signal.addEventListener('abort',()=>{clearTimeout(timer);reject(new DOMException('Aborted','AbortError'))},{once:true});});
MuhitForm.mount('#profile',{locale:'en',title:'Profile',fields:[{name:'email',label:'Email',type:'email',required:true}],validationDelay:200,validateAsync:async(values,signal)=>{await wait(signal);return values.email==='used@example.com'?{email:'This address is already in use.'}:{}},onSubmit:async values=>{document.querySelector('#saved').textContent='Profile saved in this example: '+values.email}});
MuhitFields.combobox('#lookup',{locale:'en',label:'Find a team',name:'team',required:true,load:async(query,signal)=>{await wait(signal);return [{id:'research',label:'Research'},{id:'design',label:'Design'},{id:'engineering',label:'Engineering'}].filter(t=>t.label.toLowerCase().includes(query.toLowerCase()))},onChange:value=>document.querySelector('#selected').textContent=value?'Selected: '+value.label:'No team selected'});
MuhitFields.repeater('#members',{locale:'en',title:'Project members',groupLabel:'Member',fields:[{name:'name',label:'Name',required:true},{name:'email',label:'Email',type:'email',required:true}],values:[{name:'Ada',email:'ada@example.com'}],min:1,max:4,validateAsync:async(values,signal)=>{await wait(signal);return values.map(v=>v.email==='used@example.com'?{email:'This address is already in use.'}:{})},onSubmit:async(values,signal)=>{await wait(signal);document.querySelector('#saved').textContent=values.length+' members saved in this example.'}});
</script></body></html>
