<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Muhit · 24 tasarım görünümü</title><link rel="stylesheet" href="atelier.css"><style>.board-page{max-width:1500px;margin:auto;padding:32px}.board-page>header{margin-bottom:35px}.board-page h1{font-size:42px;margin:14px 0}.board-pair{margin:45px 0}.board-pair h2{margin-bottom:16px}.frames{display:flex;gap:24px;align-items:start;overflow:auto;padding:6px 6px 20px}.frame{border:1px solid #cbd3c8;border-radius:10px;overflow:hidden;background:#fff;flex-shrink:0}.frame.desktop{width:864px;height:600px}.frame.mobile{width:312px;height:675px}.desktop iframe{width:1440px;height:1000px;transform:scale(.6);transform-origin:0 0}.mobile iframe{width:390px;height:844px;transform:scale(.8);transform-origin:0 0}iframe{border:0;display:block}.frame-caption{font-size:11px;margin-bottom:8px}@media(max-width:760px){.board-page{padding:20px}.board-page h1{font-size:34px}.frame.desktop{width:288px;height:200px}.desktop iframe{transform:scale(.2)}.frames{flex-direction:column;overflow:visible}.frame.mobile{max-width:100%}}</style></head><body><main class="board-page"><header><span class="eyebrow">Muhit / tasarım inceleme panosu</span><h1>On iki ekran. İki ölçek.<br>Tek bir ortak dil.</h1><p>Masaüstü 1440 px · Mobil 390 px. Çerçevelerin içi kaydırılabilir ve etkileşimlidir.</p><a class="btn" style="margin-top:18px" href="index.html?screen=catalog">Kart, satır ve bölüm kataloğunu aç →</a></header><div id="boards"></div></main><script>const items=[['discover','01 · Keşif'],['search','02 · Arama sonuçları'],['detail','03 · İçerik detayı'],['workspace','04 · Çalışma alanı'],['project','05 · Proje yönetimi'],['review','06 · AI inceleme'],['collections','07 · Koleksiyonlar'],['team','08 · Ekip'],['settings','09 · Görünüm ayarları'],['notifications','10 · Bildirim merkezi'],['activity','11 · Etkinlik akışı'],['resources','12 · Kaynak tarayıcısı']];document.getElementById('boards').innerHTML=items.map(([id,title])=>`<section class="board-pair"><h2>${title}</h2><div class="frames"><div><div class="frame-caption">MASAÜSTÜ · 1440 × 1000</div><div class="frame desktop"><iframe loading="lazy" title="${title} masaüstü" src="index.html?screen=${id}"></iframe></div></div><div><div class="frame-caption">MOBİL · 390 × 844</div><div class="frame mobile"><iframe loading="lazy" title="${title} mobil" src="index.html?screen=${id}"></iframe></div></div></div></section>`).join('');</script></body></html>
