name: Verify Muhit
on: [push, pull_request]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    env:
      MUHIT_BROWSER: ${{ matrix.browser }}
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm test && npm run check:brand
      - run: node tools/record-test.mjs npm run test:migration
      - run: node tools/record-test.mjs npm run test:foundations
        env:
          MUHIT_BROWSER: ${{ matrix.browser }}
      - run: node tools/record-test.mjs npm run test:p3
      - run: node tools/record-test.mjs npm run test:production
        env:
          MUHIT_BROWSER: ${{ matrix.browser }}
      - run: node tools/record-test.mjs npm run test:extended
        env:
          MUHIT_BROWSER: ${{ matrix.browser }}
      - run: node tools/record-test.mjs npm run test:scale
        env:
          MUHIT_BROWSER: ${{ matrix.browser }}
      - run: node tools/record-test.mjs npm run test:release
        env:
          MUHIT_BROWSER: ${{ matrix.browser }}
      - run: node tools/record-test.mjs npm run test:accessibility
        env:
          MUHIT_BROWSER: ${{ matrix.browser }}
      - if: matrix.browser == 'chromium'
        run: node tools/record-test.mjs npm run verify:all
      - if: matrix.browser == 'chromium'
        run: npm --prefix examples/react ci && npm run test:bundles && npm pack --dry-run
      - if: always() && matrix.browser == 'chromium'
        run: node tools/record-test.mjs npm run test:visual
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: verification-${{ matrix.browser }}
          path: |
            tests/*verification*.json
            tests/evidence/
            tests/visual/linux-chromium/*.png
